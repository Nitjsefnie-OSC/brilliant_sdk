name: OSC Pillow Compatibility

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Ref or SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  python-310-pillow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Record target provenance
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          echo "target_ref: $TARGET_REF"
          echo "target_sha: $(git rev-parse HEAD)"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Prove Python 3.10 dev fallback and Pillow compatibility
        working-directory: python
        run: |
          python --version
          uv run --python 3.10 python - <<'PY'
          import sys

          import tomli
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          assert sys.version_info[:2] == (3, 10), sys.version_info
          with open("pyproject.toml", "rb") as manifest:
              dev = tomli.load(manifest)["dependency-groups"]["dev"]
          matches = [
              Requirement(raw)
              for raw in dev
              if canonicalize_name(Requirement(raw).name) == "tomli"
          ]
          assert len(matches) == 1, matches
          requirement = matches[0]
          assert str(requirement.marker) == 'python_version < "3.11"', requirement
          assert {str(item) for item in requirement.specifier} == {">=2.0.1"}
          print(f"python: {sys.version.split()[0]}")
          print(f"tomli: {tomli.__version__}")
          print(f"declared: {requirement}")
          PY
          uv run --python 3.10 pytest packages/brilliant_msg/tests/test_pillow_compatibility.py -q
