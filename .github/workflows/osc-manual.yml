name: OSC Manual Validation

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Ref or SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  lua-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Record target provenance
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          echo "target_ref: $TARGET_REF"
          echo "target_sha: $(git rev-parse HEAD)"

      - name: Check device-side Lua is in sync across SDKs
        run: python3 tools/check_lua_parity.py
