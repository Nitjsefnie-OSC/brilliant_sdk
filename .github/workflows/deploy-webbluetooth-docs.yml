name: Deploy WebBluetooth Docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'webbluetooth/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            webbluetooth/packages/brilliant-ble/package-lock.json
            webbluetooth/packages/brilliant-msg/package-lock.json

      - name: Build brilliant-ble example and API docs
        working-directory: webbluetooth/packages/brilliant-ble
        run: |
          npm ci
          npm run build:example
          npm run docs:api

      - name: Build brilliant-msg example and API docs
        working-directory: webbluetooth/packages/brilliant-msg
        run: |
          npm ci
          npm run build:example
          npm run docs:api

      - name: Combine into single deploy directory
        run: |
          mkdir -p deploy/brilliant-ble
          mkdir -p deploy/brilliant-msg
          cp -r webbluetooth/packages/brilliant-ble/example/dist/. deploy/brilliant-ble/
          cp -r webbluetooth/packages/brilliant-msg/example/dist/. deploy/brilliant-msg/
          cp webbluetooth/index.html deploy/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
